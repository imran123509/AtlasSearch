[project]
name = "atlas-crawler"
version = "0.1.0"
description = "AtlasSearch web crawler — fetch loop, politeness, robots, DNS"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "redis>=5.0",
    "tldextract>=5.1",      # public-suffix-aware registrable domain
    "aioboto3>=13.0",       # blob store (S3/MinIO)
    "aiokafka>=0.11",
    "protego>=0.3",         # robots.txt parser — handles real-world files
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "respx>=0.21",          # httpx mocking
    "ruff>=0.5",
]

[project.scripts]
atlas-crawler = "atlas_crawler.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
